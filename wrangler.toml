name = "redlamp-me"
main = "src/index.ts"
compatibility_date = "2025-01-15"
workers_dev = false
preview_urls = true

# Custom domains
routes = [
	{ pattern = "redlamp.me", custom_domain = true },
	{ pattern = "www.redlamp.me", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "redlamp-leetcode"
database_id = "a46590bf-fd31-4c67-b162-986f9e55f4da"
migrations_dir = "migrations"

[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Static assets configuration
[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/leetcode", "/leetcode/*", "/leetcode.html"]

[build]
command = "bun run build"
watch_dir = ["src", "web", "shared", "public"]

[dev]
port = 8787
local_protocol = "http"

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
