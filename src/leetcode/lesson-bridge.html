<script>
(() => {
	'use strict';
	if (parent === window) return; // Full-page display: no notebook to talk to.
	const host = document.createElement('lesson-ai');
	host.style.cssText = 'all:initial;position:absolute;z-index:2147483647;display:none';
	const root = host.attachShadow({ mode: 'open' });
	root.innerHTML = '<style>button{font:600 14px/1.2 system-ui,sans-serif;padding:10px 14px;border:0;border-radius:999px;background:#1d2433;color:#fff;box-shadow:0 0 0 1px #fff,0 4px 12px #0006;cursor:pointer;user-select:none}button:focus-visible{outline:3px solid #8fa9ff;outline-offset:2px}</style><button type="button" title="Ctrl+Enter" aria-keyshortcuts="Control+Enter Meta+Enter">Explain with AI</button>';
	document.documentElement.append(host);
	const button = root.querySelector('button'), skip = /[\s\u00ad\u200b]/, low = c => c.toLowerCase()[0];
	let picked = '', pressing = false, marks = [];
	const hide = () => { host.style.display = 'none'; picked = ''; };
	const send = () => { if (picked) parent.postMessage({ type: 'explain', text: picked }, '*'); hide(); };
	button.addEventListener('mousedown', e => e.preventDefault()); // Keep the selection visible.
	button.addEventListener('click', send);
	addEventListener('pointerdown', e => { pressing = e.target === host; }, true);
	addEventListener('keydown', e => { if (picked && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
	document.addEventListener('selectionchange', () => {
		const sel = getSelection(), text = sel.rangeCount ? sel.toString().replace(/\s+/g, ' ').trim() : '';
		if (!text || document.activeElement?.closest('input,textarea,select,[contenteditable]')) { if (!pressing) hide(); return; }
		picked = text.slice(0, 2000);
		const r = sel.getRangeAt(0).getBoundingClientRect(), gap = matchMedia('(pointer: coarse)').matches ? 32 : 8;
		host.style.display = 'block';
		host.style.top = Math.max(8, Math.min(r.bottom + gap, innerHeight - host.offsetHeight - 8)) + scrollY + 'px';
		host.style.left = Math.max(8, Math.min(r.left, innerWidth - host.offsetWidth - 8)) + scrollX + 'px';
	});
	addEventListener('message', e => {
		if (e.source !== parent || e.data?.type !== 'highlight' || typeof e.data.quote !== 'string') return;
		for (const m of marks) m.replaceWith(...m.childNodes);
		marks = [];
		const key = e.data.quote.split('').filter(c => !skip.test(c)).map(low).join('');
		let text = '';
		const at = [], walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
		for (let n; (n = walker.nextNode());) {
			const p = n.parentElement;
			if (!p || p.closest('svg,textarea,select') || !p.checkVisibility()) continue;
			for (let i = 0; i < n.data.length; i++) if (!skip.test(n.data[i])) { text += low(n.data[i]); at.push([n, i]); }
		}
		// Longest prefix of the quote that the lesson contains, at least 16 characters or the full quote.
		let lo = Math.min(key.length, 16), hi = key.length, from = -1, size = 0;
		while (key && lo <= hi) { const mid = (lo + hi) >> 1, i = text.indexOf(key.slice(0, mid)); if (i < 0) hi = mid - 1; else { from = i; size = mid; lo = mid + 1; } }
		if (from < 0) { parent.postMessage({ type: 'highlighted', found: false }, '*'); return; }
		const runs = new Map();
		for (const [n, i] of at.slice(from, from + size)) runs.has(n) ? (runs.get(n)[1] = i + 1) : runs.set(n, [i, i + 1]);
		for (const [n, [a, b]] of runs) {
			const range = document.createRange(), mark = document.createElement('mark');
			range.setStart(n, a); range.setEnd(n, b); range.surroundContents(mark); marks.push(mark);
		}
		marks[0].scrollIntoView({ block: 'center' });
		parent.postMessage({ type: 'highlighted', found: true }, '*');
	});
})();
</script>
